name: webrofm
description: "WebroFM Streaming App - Luminous Stream Edition"
publish_to: 'none'
version: 1.4.2+142

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_storage: ^2.1.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^11.0.0
  file_picker: ^10.1.9
  pinput: ^5.0.0
  video_player: ^2.9.2
  permission_handler: ^12.0.2
  audioplayers: ^6.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  carousel_slider: ^5.1.1
  country_picker: ^2.0.27
  app_links: ^6.4.1
  wakelock_plus: ^1.3.2
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.1.1
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  sqflite: ^2.4.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/flags/
    - assets/video/
    - shaders/

  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/outfit/Outfit-Thin.ttf
          weight: 100
        - asset: fonts/outfit/Outfit-ExtraLight.ttf
          weight: 200
        - asset: fonts/outfit/Outfit-Light.ttf
          weight: 300
        - asset: fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: fonts/outfit/Outfit-Bold.ttf
          weight: 700
        - asset: fonts/outfit/Outfit-ExtraBold.ttf
          weight: 800
        - asset: fonts/outfit/Outfit-Black.ttf
          weight: 900
