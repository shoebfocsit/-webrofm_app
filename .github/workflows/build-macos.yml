name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Flutter Desktop)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd macos
          pod repo update
          pod install

      - name: Build macOS App (Release, No Code-Signing)
        run: |
          flutter build macos --release --no-codesign

      - name: Compress macOS App Bundle
        run: |
          cd build/macos/Build/Products/Release
          tar -czf WebroFM-macOS.tar.gz *.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle
          path: build/macos/Build/Products/Release/WebroFM-macOS.tar.gz
          retention-days: 14
