name: Build and Deploy iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      # ── 1. Checkout ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter Setup ─────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 3. CocoaPods ─────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          flutter precache --ios
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install

      # ── 4. Ruby & Fastlane ────────────────────────
      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # ── 5. Setup Certificates & Profile ──────────
      - name: Fetch Signing Certificates and Profile
        run: |
          mkdir -p /tmp/certs /tmp/profiles
          
          # Unlock keychain on macOS runner
          security default-keychain -s ~/Library/Keychains/login.keychain-db || true
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true

          # Run Fastlane lane
          bundle exec fastlane ios setup_signing

          # Extract Provisioning Profile Name
          PROFILE_FILE=$(find /tmp/profiles -name "*.mobileprovision" | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            echo "❌ No profile found in /tmp/profiles"
            exit 1
          fi
          
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_FILE")")
          echo "Installed Profile: $PROFILE_NAME"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      # ── 6. Configure ExportOptions.plist ─────────
      - name: Configure ExportOptions.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.webrofm.app $PROFILE_NAME" ios/ExportOptions.plist
          echo "=== ExportOptions.plist ==="
          cat ios/ExportOptions.plist

      # ── 7. Build Signed IPA ───────────────────────
      - name: Build iOS IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Verify IPA
        run: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ ERROR: No .ipa file found in build/ios/ipa!"
            exit 1
          fi
          echo "✅ Found IPA: $IPA_FILE"
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      # ── 8. Upload to TestFlight ───────────────────
      - name: Upload to TestFlight via Fastlane
        run: |
          bundle exec fastlane ios upload_testflight ipa:"${{ env.IPA_PATH }}"

      # ── 9. Cleanup ────────────────────────────────
      - name: Cleanup sensitive artifacts
        if: always()
        run: |
          rm -rf /tmp/certs /tmp/profiles
